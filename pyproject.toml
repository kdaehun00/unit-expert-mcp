[project]
name = "unit-expert-mcp"
version = "0.1.0"
description = "A minimal Streamable HTTP MCP server for PlayMCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sdk2026 = [
    "mcp>=2.0.0,<3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
