services:
  - type: web
    name: unit-expert-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PROTOCOL_VERSIONS
        value: "2025-03-26,2025-06-18,2025-11-25"
